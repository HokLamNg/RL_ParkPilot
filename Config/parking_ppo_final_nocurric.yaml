# Experiment A (curriculum vs no curriculum) - NO-CURRICULUM side.
# Identical to Config/parking_ppo_final_curriculum.yaml (same code, PPO settings, network, reward, budget)
# except the environment is fixed at stage 10 (the full task: any of 30 bays, +-180 deg spawns,
# 2-6 parked cars) from the first step.
#
# Headless (recommended):
#   mlagents-learn Config/parking_ppo_final_nocurric.yaml --run-id=final_nocurric_s1 --seed=1 --env=Builds/ParkPilot/ParkPilot.exe --no-graphics --num-envs=2
# In the Editor:
#   mlagents-learn Config/parking_ppo_final_nocurric.yaml --run-id=final_nocurric_s1 --seed=1
behaviors:
  ParkingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 80          # every checkpoint (40M / 500k)
    checkpoint_interval: 500000
    max_steps: 40000000           # Experiment A budget, the same for every run
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  sparse_reward: 0.0
  curriculum_stage: 10.0   # the full task from the start: no curriculum

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60