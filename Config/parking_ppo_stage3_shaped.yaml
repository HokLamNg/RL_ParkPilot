# Experiment B (sparse vs shaped reward), level 2: Stage 3, SHAPED reward, from scratch, no curriculum.
# Stage 3 = fixed bay 8, spawn 5-12 m / +-4 m / +-90 deg, 1-3 parked cars, tight-bay practice 30%,
# soft contact on. Same PPO settings and network as Config/parking_ppo_stage1.yaml; budget 3M steps.
# Counterpart: Config/parking_ppo_stage3_sparse.yaml (only sparse_reward differs).
#   mlagents-learn Config/parking_ppo_stage3_shaped.yaml --run-id=expB_s3_shaped_s1 --seed=1   (then s2, s3)
behaviors:
  ParkingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  curriculum_stage: 3.0   # index into ParkingEnvironment.stages
  sparse_reward: 0.0      # 0 = shaped reward, 1 = sparse (Experiment B)

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
