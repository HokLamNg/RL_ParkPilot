# Round 6 A/B pilot (route distance): does the reward's distance term need to follow the drivable space?
# Both pilots are identical except route_distance. They start from round5_s1 (same inputs, no widening needed) with the
# round 6 PPO settings (gamma 0.995, time horizon 256, batch 2048) and far starts in 40% of episodes. Evaluate both on the
# far-start test set (EvaluationRunner Far Starts, training car park and generated car parks) and the three existing sets.
#
# New build needed (code changed: DrivableMap, far starts). From the project folder, one window each (--env-args last):
#   mlagents-learn Config/parking_ppo_round6_pilot_straight.yaml --initialize-from=round5_s1 --run-id=r6pilot_straight --seed=1 --env=Builds/ParkPilot/ParkPilot.exe --no-graphics --num-envs=4 --base-port=5005 --env-args --bay-size-obs --near-rays
#   mlagents-learn Config/parking_ppo_round6_pilot_route.yaml --initialize-from=round5_s1 --run-id=r6pilot_route --seed=1 --env=Builds/ParkPilot/ParkPilot.exe --no-graphics --num-envs=4 --base-port=5015 --env-args --bay-size-obs --near-rays
behaviors:
  ParkingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048                # round 6: steadier gradients
      buffer_size: 40960          # 4x: steadier advantage estimates per update
      learning_rate: 1.0e-4
      beta: 1.0e-3
      epsilon: 0.1                # smaller clip range: smaller policy change per update
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995                    # round 6: a far drive is 200-400 decisions, the parking reward must reach back
        strength: 1.0
    keep_checkpoints: 80
    checkpoint_interval: 500000
    max_steps: 10000000              # pilot: 10M
    time_horizon: 256                 # round 6: longer episodes (far starts, 60 s)
    summary_freq: 10000

environment_parameters:
  curriculum_stage: 10.0
  sparse_reward: 0.0
  geometry_randomization: 1.0
  geometry_share: 0.5
  occupancy_randomization: 1.0
  stuck_steps_near_bay: 400
  procedural_layout: 0.5
  procedural_difficulty: 2.0
  hard_case_share: 0.5
  far_start_share: 0.4            # round 6: 40% of episodes start anywhere in the aisles (10-40 m route), 60% as before
  route_distance: 1.0             # A/B pilot: distance along drivable space
  route_clearance: 0.3
  empty_bay_cost: 3.0
engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
