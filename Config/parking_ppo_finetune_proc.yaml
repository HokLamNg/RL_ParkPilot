# Fine-tuning round 3: procedural car parks (every car park is built differently).
# Starts from finetune_occ_s3 (occupancy fine-tune, best on realistic occupancy). Identical PPO settings to Experiment A;
# environment: stage 10, geometry + occupancy randomisation, and procedural_layout 0.5: half the episodes on a new random
# car park (ProceduralLot: bay 2.9-3.6 x 4.6-5.4 m, aisles 6-11 m, 3-4 rows, walls between back-to-back rows, pillars,
# cross aisles), the other half on the training car park so it is not forgotten.
#
# Build the training player first, then, from the project folder, one window per seed:
#   mlagents-learn Config/parking_ppo_finetune_proc.yaml --initialize-from=finetune_occ_s3 --run-id=finetune_proc_s1 --seed=1 --env=Builds/ParkPilot/ParkPilot.exe --no-graphics --num-envs=4 --base-port=5005
#   ... --run-id=finetune_proc_s2 --seed=2 --base-port=5015
#   ... --run-id=finetune_proc_s3 --seed=3 --base-port=5025
behaviors:
  ParkingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 40          # every checkpoint (20M / 500k)
    checkpoint_interval: 500000
    max_steps: 20000000           # fine-tuning budget (counted from 0 for the new run)
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  curriculum_stage: 10.0          # full task only
  sparse_reward: 0.0
  geometry_randomization: 1.0
  occupancy_randomization: 1.0
  procedural_layout: 0.5          # half the episodes on a new generated car park

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
