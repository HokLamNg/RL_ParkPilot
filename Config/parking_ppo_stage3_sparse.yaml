# Experiment B (sparse vs shaped reward), level 2: Stage 3, SPARSE reward, from scratch, no curriculum.
# Identical to Config/parking_ppo_stage3_shaped.yaml except sparse_reward: 1.0.
# Sparse = +2 parked, -1 collision / out of bounds; no step penalty, no shaping, no soft-contact
# penalties, stuck / no-progress endings give 0.
#   mlagents-learn Config/parking_ppo_stage3_sparse.yaml --run-id=expB_s3_sparse_s1 --seed=1   (then s2, s3)
behaviors:
  ParkingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  curriculum_stage: 3.0   # index into ParkingEnvironment.stages
  sparse_reward: 1.0      # 0 = shaped reward, 1 = sparse (Experiment B)

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
