# Fine-tuning for real car parks, round 2: occupancy randomisation on top of geometry randomisation.
# Starts from finetune_geom_s1 (best geometry fine-tune). Identical PPO settings to Experiment A; only the
# environment changes: stage 10 (full task), geometry_randomization on (see parking_ppo_finetune_geomrand.yaml)
# and occupancy_randomization on: 0-27 of 30 bays occupied per episode instead of the stage's 2-6.
# Why: on a real 90%-full car park the agent stopped crooked next to full rows, and in a nearly
# empty one it stopped short; it had learned to use the few parked cars of training as reference points.
#
# Build the training player first, then, from the project folder, one window per seed:
#   mlagents-learn Config/parking_ppo_finetune_occrand.yaml --initialize-from=finetune_geom_s1 --run-id=finetune_occ_s1 --seed=1 --env=Builds/ParkPilot/ParkPilot.exe --no-graphics --num-envs=4 --base-port=5005
#   ... --run-id=finetune_occ_s2 --seed=2 --base-port=5015
#   ... --run-id=finetune_occ_s3 --seed=3 --base-port=5025
behaviors:
  ParkingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 30          # every checkpoint (15M / 500k)
    checkpoint_interval: 500000
    max_steps: 15000000           # fine-tuning budget (counted from 0 for the new run)
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  curriculum_stage: 10.0          # full task only
  sparse_reward: 0.0
  geometry_randomization: 1.0
  occupancy_randomization: 1.0

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
