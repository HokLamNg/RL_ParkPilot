# Experiment D (PPO vs SAC): the SAC side, on the Stage 1 setup (fixed bay 8, near spawn, no obstacles).
# Identical to Config/parking_ppo_stage1.yaml in everything except the algorithm:
#   same environment (curriculum_stage 0, shaped reward), network (normalize, 2 x 256),
#   gamma 0.99, and step budget (500k steps).
# SAC hyperparameters follow the ML-Agents SAC defaults / example configs; they are NOT tuned for
# this task.
#
# Speed test first (~5 min, then Ctrl+C), to measure SAC's steps/s on this PC:
#   mlagents-learn Config/parking_sac_stage1.yaml --run-id=expD_sac_speedtest --seed=1
# Then the real runs:
#   mlagents-learn Config/parking_sac_stage1.yaml --run-id=expD_sac_s1 --seed=1   (then s2, s3)
# Press Play in Unity when the trainer prints "Listening on port 5004".

behaviors:
  ParkingAgent:
    trainer_type: sac
    hyperparameters:
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      batch_size: 256              # samples per gradient update
      buffer_size: 500000          # replay buffer (steps kept for re-use)
      buffer_init_steps: 10000     # random-ish experience collected before learning starts
      tau: 0.005                   # target-network soft-update rate
      steps_per_update: 10.0       # one gradient update per 10 agent steps (higher = faster, less sample-efficient)
      save_replay_buffer: false
      init_entcoef: 0.5            # initial entropy coefficient (exploration); learned automatically
      reward_signal_steps_per_update: 10.0
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 500000      # Experiment D budget (both algorithms); Stage 1 levels off well before this
    time_horizon: 64
    summary_freq: 10000

environment_parameters:
  curriculum_stage: 0.0   # index into ParkingEnvironment.stages (0 = fixed bay, near, aligned)
  sparse_reward: 0.0      # shaped reward, as in the PPO counterpart

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
