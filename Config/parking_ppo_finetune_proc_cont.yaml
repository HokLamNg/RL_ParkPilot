# Fine-tuning round 3, continuation: procedural car parks with gentler updates.
# The first 20M steps (parking_ppo_finetune_proc.yaml, learning rate 3e-4, entropy bonus 5e-3) disrupted the policy and
# ended noisier (entropy 1.65-1.73) and worse than its start model in deterministic evaluation,
# while still improving. This continues each seed from its 20M model with learning rate 1e-4 and entropy bonus 1e-3,
# same environment (stage 10, geometry + occupancy randomisation, procedural_layout 0.5), 20M more steps, new run IDs.
#
# Build is unchanged (no code changes). From the project folder, one window per seed:
#   mlagents-learn Config/parking_ppo_finetune_proc_cont.yaml --initialize-from=finetune_proc_s1 --run-id=finetune_proc2_s1 --seed=1 --env=Builds/ParkPilot/ParkPilot.exe --no-graphics --num-envs=4 --base-port=5005
#   ... --initialize-from=finetune_proc_s2 --run-id=finetune_proc2_s2 --seed=2 --base-port=5015
#   ... --initialize-from=finetune_proc_s3 --run-id=finetune_proc2_s3 --seed=3 --base-port=5025
behaviors:
  ParkingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 1.0e-4       # gentler than the first 20M (3e-4), which disrupted the policy
      beta: 1.0e-3                # smaller entropy bonus: entropy had risen to 1.65-1.73
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 40          # every checkpoint (20M / 500k)
    checkpoint_interval: 500000
    max_steps: 20000000           # fine-tuning budget (counted from 0 for the new run)
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  curriculum_stage: 10.0          # full task only
  sparse_reward: 0.0
  geometry_randomization: 1.0
  occupancy_randomization: 1.0
  procedural_layout: 0.5          # half the episodes on a new generated car park

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
