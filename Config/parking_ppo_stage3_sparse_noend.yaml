# Experiment B, "sparse, NO early endings" variant. Identical to Config/parking_ppo_stage3_sparse.yaml
# except early_endings: 0.0, so the stuck / no-progress endings (added in v7-v8 to break local optima of
# the SHAPED reward) are off and episodes run until park, crash, out of bounds or the 30 s timeout.
# Rewards: +2 parked, -1 collision / out of bounds, nothing else.
#   mlagents-learn Config/parking_ppo_stage3_sparse_noend.yaml --run-id=expB_s3_sparseNE_s1 --seed=1   (then s2, s3)
behaviors:
  ParkingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  curriculum_stage: 3.0   # index into ParkingEnvironment.stages
  sparse_reward: 1.0      # 0 = shaped reward, 1 = sparse (Experiment B)
  early_endings: 0.0      # stuck / no-progress endings OFF: episodes end on park, crash, out of bounds or timeout (30 s)

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
