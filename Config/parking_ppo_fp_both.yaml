# Stall test C for the full run: straight-line distance and Experiment A PPO settings: control (Experiment A plus the new inputs)
# Both full-run attempts stalled in curriculum stage 3. This test runs only the stage curriculum (stages 0-10, reward
# threshold 3.1 as Experiment A) from scratch with the new inputs (--bay-size-obs --near-rays), everything else held at
# the stage-lesson values of parking_ppo_full.yaml. Learning rate, clip and entropy bonus constant at the values the full
# run had in its first 15M steps (3e-4, 0.2, 5e-3). Stopped by hand once it passes stage 3 to 4 or clearly does not.
#   mlagents-learn Config/parking_ppo_fp_both.yaml --run-id=fp_both_s1 --seed=1 --env=Builds/ParkPilot/ParkPilot.exe --no-graphics --num-envs=4 --base-port=PORT --env-args --bay-size-obs --near-rays
behaviors:
  ParkingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 20
    checkpoint_interval: 1000000
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  sparse_reward: 0.0
  route_distance: 0.0
  route_clearance: 0.3
  empty_bay_cost: 3.0
  geometry_randomization: 0.0
  occupancy_randomization: 0.0
  procedural_layout: 0.0
  far_start_share: 0.0
  stuck_steps_near_bay: 0.0
  curriculum_stage:
    curriculum:
      - name: S0_FixedBayNear
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 0.0
      - name: S1_ModerateSpawnHeading
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 1.0
      - name: S2_RandomSpawnHeading
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 2.0
      - name: S3_StaticParkedCars
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 3.0
      - name: S4_RandomInnerBay
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 4.0
      - name: S5_OuterRowPractice
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 5.0
      - name: S6_InnerPlusOuterRows
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 6.0
      - name: S7_PlusCornerBays
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 7.0
      - name: S8_PlusSidewaysAllBays
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 8.0
      - name: S9_SharperTurnarounds
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 9.0
      - name: S10_FullTask
        value: 10.0

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
