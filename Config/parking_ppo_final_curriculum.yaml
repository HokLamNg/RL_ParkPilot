# Experiment A (curriculum vs no curriculum) - CURRICULUM side, and the clean reproducible main result.
# The frozen final setup (code v11 + clean 2-action space), trained FROM SCRATCH:
# the same PPO settings, network, reward and 11-lesson curriculum (stages 0 -> 10, cut-off 3.1) as the
# development run curric6_ppo_s1, but in one uninterrupted run with no code changes.
# Counterpart: Config/parking_ppo_final_nocurric.yaml (identical except no curriculum).
#
# Headless (recommended, build the training player first):
#   mlagents-learn Config/parking_ppo_final_curriculum.yaml --run-id=final_curric_s1 --seed=1 --env=Builds/ParkPilot/ParkPilot.exe --no-graphics --num-envs=2
# In the Editor:
#   mlagents-learn Config/parking_ppo_final_curriculum.yaml --run-id=final_curric_s1 --seed=1
# Then s2, s3 with --seed=2 / --seed=3.
behaviors:
  ParkingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 80          # every checkpoint (40M / 500k)
    checkpoint_interval: 500000
    max_steps: 40000000           # Experiment A budget, the same for every run
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  sparse_reward: 0.0
  curriculum_stage:
    curriculum:
      - name: S0_FixedBayNear
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 500, threshold: 3.1}
        value: 0.0
      - name: S1_ModerateSpawnHeading
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 1.0
      - name: S2_RandomSpawnHeading
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 2.0
      - name: S3_StaticParkedCars
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 3.0
      - name: S4_RandomInnerBay
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 4.0
      - name: S5_OuterRowPractice
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 5.0
      - name: S6_InnerPlusOuterRows
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 6.0
      - name: S7_PlusCornerBays
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 7.0
      - name: S8_PlusSidewaysAllBays
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 8.0
      - name: S9_SharperTurnarounds
        completion_criteria: {measure: reward, behavior: ParkingAgent, signal_smoothing: true, min_lesson_length: 1000, threshold: 3.1}
        value: 9.0
      - name: S10_FullTask
        value: 10.0

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
